# Supabase Multitenant — production deploy (Coolify dockercompose build-pack)
# Control-plane panel + metadata Postgres. The panel mounts the host Docker
# socket so, from its UI, you can create isolated Supabase stacks.
# Postgres is named 'db' (not 'postgres') to avoid any DNS alias collision.

name: supabase-multitenant

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-supabase_multitenant}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-supabase_multitenant}
      POSTGRES_DB: supabase_multitenant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-supabase_multitenant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_MULTITENANT_MODE: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-supabase_multitenant}:${SERVICE_PASSWORD_POSTGRES:-supabase_multitenant}@db:5432/supabase_multitenant
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supabase-multitenant-change-me-please}
      NEXTAUTH_URL: http://localhost:3000
      APP_NAME: ${APP_NAME:-Supabase Multitenant}
      APP_URL: http://localhost:3000
      DATA_PATH: /data
      SUPABASE_CORE_REPO_URL: ${SUPABASE_CORE_REPO_URL:-https://github.com/supabase/supabase}
    volumes:
      - panel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.smt-panel-http.entryPoints=http
      - traefik.http.routers.smt-panel-http.rule=Host(`fmhych0pt0irtksig4kciewg.213.47.80.26.sslip.io`)
      - traefik.http.routers.smt-panel-http.service=smt-panel
      - traefik.http.routers.smt-panel-http.middlewares=redirect-to-https
      - traefik.http.routers.smt-panel-https.entryPoints=https
      - traefik.http.routers.smt-panel-https.rule=Host(`fmhych0pt0irtksig4kciewg.213.47.80.26.sslip.io`)
      - traefik.http.routers.smt-panel-https.tls.certresolver=letsencrypt
      - traefik.http.routers.smt-panel-https.service=smt-panel
      - traefik.http.services.smt-panel.loadbalancer.server.port=3000

volumes:
  postgres_data:
  panel_data:
