# Supabase Multitenant — production deploy (Coolify dockercompose build-pack)
# Deploys the control-plane panel + its metadata Postgres. The panel mounts the
# host Docker socket so, from its UI, you can create isolated Supabase stacks.
# This mirrors deploy/coolify/supabase-multitenant.yml (the one-click template).

name: supabase-multitenant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supabase_multitenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supabase_multitenant}
      POSTGRES_DB: supabase_multitenant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_multitenant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPABASE_MULTITENANT_MODE: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-supabase_multitenant}:${POSTGRES_PASSWORD:-supabase_multitenant}@postgres:5432/supabase_multitenant
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supabase-multitenant-change-me-please}
      NEXTAUTH_URL: http://localhost:3000
      APP_NAME: ${APP_NAME:-Supabase Multitenant}
      APP_URL: http://localhost:3000
      DATA_PATH: /data
      SUPABASE_CORE_REPO_URL: ${SUPABASE_CORE_REPO_URL:-https://github.com/supabase/supabase}
    volumes:
      - panel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  panel_data:
