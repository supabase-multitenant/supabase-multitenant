# Supabase Multitenant Development Docker Compose
# For production, use the docker-compose.yml generated by install.sh at /etc/supabase-multitenant/

version: "3.8"

name: supabase-multitenant-dev

networks:
  supabase-multitenant-network:
    driver: bridge

services:
  # PostgreSQL Database (for testing production mode locally)
  postgres:
    image: postgres:16-alpine
    container_name: supabase-multitenant-dev-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: supabase_multitenant
      POSTGRES_PASSWORD: supabase_multitenant_dev_password
      POSTGRES_DB: supabase_multitenant
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - supabase-multitenant-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U supabase_multitenant" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
