# Dispatch a website rebuild when the site source changes.
#
# The single source of truth for the website is THIS repo's website/ directory.
# The publisher is supabase-multitenant/supabase-multitenant.github.io, whose
# .github/workflows/pages.yml listens for a repository_dispatch of type
# website-build, then checks out this repo, builds website/ and deploys it.
#
# This workflow fires the repository_dispatch, so editing website/ goes live
# immediately after a push to main (no waiting for the nightly sync).
#
# Requires the SITE_DISPATCH_TOKEN repo secret: a PAT with repo scope on the
# Pages repo (GITHUB_TOKEN cannot emit events into a different repo).
name: Dispatch website deployment

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/supabase-multitenant/supabase-multitenant.github.io/dispatches \
            -d '{"event_type":"website-build"}')
          echo "repository_dispatch HTTP ${code}"
          cat /tmp/dispatch.out
          echo ""
          test "$code" = "204"