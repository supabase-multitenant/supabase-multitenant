# documentation: https://github.com/supabase-multitenant/supabase-multitenant
# slogan: Run your own Supabase Cloud-style multi-tenant control plane. 1 infrastructure, many isolated databases.
# category: backend
# tags: supabase, multitenant, self-hosted, database, backend
# logo: svgs/supabase.svg
# port: 3000

name: supabase-multitenant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-supabase_multitenant}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-supabase_multitenant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - supabase-multitenant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-supabase_multitenant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    image: ghcr.io/supabase-multitenant/supabase-multitenant:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPABASE_MULTITENANT_MODE: production
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-supabase_multitenant}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-supabase_multitenant}
      NEXTAUTH_SECRET: ${SERVICE_PASSWORD_NEXTAUTHSECRET:-supabase-multitenant-change-me}
      NEXTAUTH_URL: http://localhost:3000
      APP_NAME: ${APP_NAME:-Supabase Multitenant}
      APP_URL: http://localhost:3000
      DATA_PATH: /data
      SUPABASE_CORE_REPO_URL: ${SUPABASE_CORE_REPO_URL:-https://github.com/supabase/supabase}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - panel_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - supabase-multitenant-network

networks:
  supabase-multitenant-network:
    name: supabase-multitenant-network

volumes:
  postgres_data:
  panel_data:
